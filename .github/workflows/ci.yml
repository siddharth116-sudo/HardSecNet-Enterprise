name: HardSecNet CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: lint + unit tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      MONGO_URI: mongodb://localhost:27017/
      DB_NAME: hardsecnet_test
      REDIS_URL: redis://localhost:6379/1
      AUTO_REMEDIATE_DEFAULT: "False"
      DRIFT_THRESHOLD: "80"
      ALLOWED_ORIGINS: "*"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend: install + build check
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]
    defaults:
      run:
        working-directory: Dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://localhost:8443

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Dashboard/dist

  # ─────────────────────────────────────────────────────────────────────────
  # Docker: verify compose stack builds without errors
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate PKI certificates
        run: python pki_setup.py
        continue-on-error: true   # Non-critical if openssl not available

      - name: Build Docker images
        run: |
          docker compose -f deployment/docker-compose.yml build
        env:
          JWT_SECRET_KEY: ci-docker-build-secret

      - name: Smoke test — start stack
        run: |
          docker compose -f deployment/docker-compose.yml up -d
          sleep 15
          curl --retry 5 --retry-delay 3 -f http://localhost:5000/api/health || true
        env:
          JWT_SECRET_KEY: ci-docker-build-secret

      - name: Tear down stack
        if: always()
        run: docker compose -f deployment/docker-compose.yml down -v
