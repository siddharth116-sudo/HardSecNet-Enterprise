# HardSecNet production stack.
#
#   internet -> caddy (80/443, auto-HTTPS) -> frontend nginx -> backend -> mongo/redis
#
# Only Caddy publishes ports to the host. Backend, Mongo, and Redis live on
# the private Docker network and are NOT reachable from the internet.
# Configure everything in deployment/.env (see .env.example).

services:
  caddy:
    image: caddy:2-alpine
    container_name: hardsecnet_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in deployment/.env (e.g. hardsecnet.duckdns.org)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Let's Encrypt certificates persist here
      - caddy_config:/config
    depends_on:
      - frontend

  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    container_name: hardsecnet_backend
    restart: always
    environment:
      - FLASK_ENV=production
      # Authenticated Mongo connection (credentials live in deployment/.env)
      - MONGO_URI=mongodb://${MONGO_USER:?set MONGO_USER in deployment/.env}:${MONGO_PASSWORD:?set MONGO_PASSWORD in deployment/.env}@mongo:27017/hardsecnet?authSource=admin
      # No insecure fallback: the app refuses to start without a real secret
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?generate a strong JWT_SECRET_KEY (python -c "import secrets;print(secrets.token_urlsafe(48))")}
      - NODE_SECRET_KEY=${NODE_SECRET_KEY:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?set a strong BOOTSTRAP_ADMIN_PASSWORD in deployment/.env}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - ALLOWED_ORIGINS=https://${DOMAIN}
      - SEED_DEMO_USERS=false
      - REDIS_URL=redis://redis:6379/0
      - RELIABILITY_MODE=true
      - SOCKETIO_ASYNC_MODE=eventlet
      # - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - mongo
      - redis
    expose:
      - "5000" # private network only — reached via nginx, never the internet
    volumes:
      - backend_logs:/app/logs
      - ../Reports:/app/Reports

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
      args:
        # The dashboard calls the API on the same domain; Caddy + nginx route it
        - VITE_API_BASE_URL=https://${DOMAIN}
    container_name: hardsecnet_frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "80" # private network only — Caddy is the public entrypoint
    volumes:
      # HTTP-only config: TLS is Caddy's job, so no cert mounts needed here
      - ./nginx/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro

  mongo:
    image: mongo:7
    container_name: hardsecnet_mongo
    restart: always
    environment:
      # Enabling these makes Mongo require authentication for every connection
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?set MONGO_USER in deployment/.env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in deployment/.env}
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: hardsecnet_redis
    restart: always
    # no ports: private network only

volumes:
  mongo_data:
  backend_logs:
  caddy_data:
  caddy_config:
